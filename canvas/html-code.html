<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экспорт в Obsidian Canvas</title>
    <!-- Подключение внешнего CSS файла -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <main>
            <!-- Панель управления -->
            <section class="controls">
                <button id="addCardBtn" class="btn">Добавить карточку</button>
                <button id="saveCanvasBtn" class="btn btn-primary">Сохранить в .canvas</button>
            </section>

            <!-- Область для отображения карточек -->
            <section id="cardsContainer" class="cards-container">
                <!-- Карточки будут добавляться сюда динамически -->
            </section>
        </main>
    </div>

    <!-- Подключение внешнего JS файла -->
    <script src="script.js"></script>
</body>
</html>
